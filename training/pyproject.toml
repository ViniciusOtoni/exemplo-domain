[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exemplo-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "training-platform @ git+https://github.com/ViniciusOtoni/platform-libs@training-platform-v0.1.0#subdirectory=packages/training-platform",
]

[tool.setuptools.packages.find]
where = ["src"]
