[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exemplo-features"
version = "0.3.1"
requires-python = ">=3.11"
# Pinado pela URL do WHEEL do Release, e não por git+https.
#
# O wheel do domínio é instalado dentro do serverless, e o pip precisa satisfazer
# esta linha lá dentro. Um `git+https` exige git e um clone do repositório, o que
# falha no serverless com "Unable to find or download the required package".
# A URL do Release é um único GET HTTPS — verificado ao vivo que funciona.
dependencies = [
    "mlplatform @ https://github.com/ViniciusOtoni/platform-libs/releases/download/mlplatform-v3.9.1/mlplatform-3.9.1-py3-none-any.whl",
]

# Como o framework descobre este domínio: importar o módulo é o que dispara os
# decorators @feature_table. Antes era um import escrito à mão dentro do
# notebook; com python_wheel_task não há notebook onde escrevê-lo.
[project.entry-points."mlplatform.domains"]
exemplo_features = "exemplo_features.configs"

# Dependências de teste do domínio. Ficam aqui, e não num requirements-dev.txt
# solto, para que o pacote declare tudo o que precisa num arquivo só.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyspark>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
