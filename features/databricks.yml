bundle:
  name: exemplo-features

include:
  - resources/*.yml

artifacts:
  exemplo_features:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog for feature tables and the audit table.
    default: workspace
  git_commit:
    description: Git commit SHA of the deploy, propagated to job parameters for auditing.
    default: local
  git_branch:
    description: Git branch of the deploy, propagated to job parameters for auditing.
    default: local
  database_instance_name:
    description: Lakebase Database Instance name for online=True feature tables. Only used when a feature table has online=True; ignored otherwise.
    default: exemplo-lakebase

targets:
  dev:
    mode: development
    default: true
