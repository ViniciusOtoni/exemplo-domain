# que preserva a capacidade de cada bundle subir em momento diferente. Bundles
# ainda não migrados seguem nas tags antigas por componente até sua vez.
framework:
  package: mlplatform
  version: v3.5.1

components:
  features: migrated
  training: migrated
  serving: migrated
  monitoring: pending
